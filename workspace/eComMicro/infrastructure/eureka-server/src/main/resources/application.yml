spring:
  application:
    name: eureka-server
  jpa:
    hibernate:
      ddl-auto: update

server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    enableSelfPreservation: false

management:
  endpoints:
    web:
      exposure:
        include: '*'

