name: flutter_mlm_investment
description: "MLM + Investment Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.1
  
  # HTTP & API
  http: ^1.1.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  
  # Charts & Graphs
  fl_chart: ^0.65.0
  
  # Image & File Handling
  image_picker: ^1.0.5
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^3.5.5
  
  # Utilities
  intl: ^0.18.1
  url_launcher: ^6.2.2
  
  # Encryption
  encrypt: ^5.0.3
  crypto: ^3.0.3
  
  # Notifications - Will be added in Phase 11
  # firebase_core: ^2.24.2
  # firebase_messaging: ^14.7.9
  # flutter_local_notifications: ^16.3.0
  
  # OTP Input
  pinput: ^3.0.1
  
  # Shimmer Loading
  shimmer: ^3.0.0
  
  # PDF Generation (for reports)
  pdf: ^3.10.7
  printing: ^5.11.1
  share_plus: ^12.0.1
  file_picker: ^10.3.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  # assets:
  #   - assets/images/
  #   - assets/icons/
